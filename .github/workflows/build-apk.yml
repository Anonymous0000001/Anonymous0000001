name: Gerar APK Hardware HUD

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar código
        uses: actions/checkout@v4

      - name: 2. Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Instalar Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 4. Compilar APK
        run: gradle assembleDebug

      - name: 5. Subir APK nos Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HardwareHUD-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: 6. Publicar APK direto em Releases (Download Direto)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Hardware HUD v1.0.${{ github.run_number }}"
          files: app/build/outputs/apk/debug/app-debug.apk
